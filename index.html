<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mquan Offline AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-dark: #1e293b;
      --card-dark: #334155;
      --border-dark: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #10b981;
      --accent-gradient: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header {
      height: 60px; border-bottom: 1px solid var(--border-dark);
      display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem;
      background: var(--panel-dark);
    }
    .brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 700; font-size: 1.1rem; }
    .logo-icon {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--accent-gradient);
      display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
    }

    .status-badge {
      font-size: 0.75rem; background: rgba(16, 185, 129, 0.15); color: #34d399;
      padding: 0.25rem 0.6rem; border-radius: 99px; font-weight: 600; border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .chat-view {
      flex: 1; overflow-y: auto; padding: 1.5rem 1.5rem 140px;
      display: flex; flex-direction: column; align-items: center;
    }
    .chat-inner { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 1.25rem; }

    .welcome-container { text-align: center; margin-top: 5vh; }
    .welcome-title {
      font-size: 2rem; font-weight: 700;
      background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .welcome-sub { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 1.5rem; }

    .progress-box {
      background: var(--panel-dark); border: 1px solid var(--border-dark);
      padding: 1rem; border-radius: 12px; margin-top: 1rem; text-align: left;
    }
    .progress-bar-bg { width: 100%; height: 8px; background: var(--card-dark); border-radius: 4px; overflow: hidden; margin-top: 0.5rem; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--accent-gradient); transition: width 0.2s; }

    .msg-row { display: flex; gap: 1rem; width: 100%; }
    .msg-row.user { justify-content: flex-end; }
    .msg-user-bubble {
      background: var(--accent); color: #fff; padding: 0.75rem 1.1rem;
      border-radius: 16px 16px 2px 16px; max-width: 80%; font-size: 0.92rem; line-height: 1.5;
    }
    .msg-ai-box { display: flex; gap: 0.8rem; width: 100%; }
    .ai-avatar {
      width: 32px; height: 32px; border-radius: 50%; background: var(--accent-gradient);
      display: flex; align-items: center; justify-content: center; font-size: 0.8rem; flex-shrink: 0;
    }
    .ai-content {
      flex: 1; background: var(--panel-dark); border: 1px solid var(--border-dark);
      padding: 1rem; border-radius: 2px 16px 16px 16px; font-size: 0.92rem; line-height: 1.6;
      white-space: pre-wrap; word-break: break-word;
    }

    .input-container {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(180deg, transparent 0%, var(--bg-dark) 40%);
      padding: 1.5rem; display: flex; justify-content: center;
    }
    .input-box {
      width: 100%; max-width: 760px; background: var(--panel-dark);
      border: 1px solid var(--border-dark); border-radius: 16px;
      padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.75rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .input-box textarea {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text-main); font-size: 0.95rem; resize: none; height: 24px; max-height: 120px;
    }
    .send-btn {
      background: var(--accent); border: none; color: white;
      width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo-icon">💻</div>
      <span>mquan Local AI</span>
    </div>
    <div class="status-badge" id="statusText">Đang khởi tạo WebGPU...</div>
  </header>

  <div class="chat-view" id="chatView">
    <div class="chat-inner">
      <div class="welcome-container" id="welcomeScreen">
        <h1 class="welcome-title">mquan Offline AI</h1>
        <p class="welcome-sub">Chạy trực tiếp trên thiết bị của bạn. Không cần API Key, bảo mật 100%.</p>
        
        <div class="progress-box" id="loadBox">
          <div style="font-size: 0.85rem; color: var(--text-sub);" id="loadLabel">Đang tải dữ liệu mô hình lần đầu...</div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
        </div>
      </div>

      <div id="messageList" style="display: flex; flex-direction: column; gap: 1.25rem;"></div>
    </div>
  </div>

  <div class="input-container">
    <div class="input-box">
      <textarea id="promptInput" rows="1" placeholder="Nhập câu hỏi tại đây..." oninput="autoResize(this)" disabled></textarea>
      <button class="send-btn" id="sendBtn" onclick="handleSend()" disabled>➤</button>
    </div>
  </div>

  <!-- TẢI THƯ VIỆN WEB-LLM CHẠY AI TRONG TRÌNH DUYỆT -->
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    // Mô hình ngôn ngữ siêu nhỏ SmolLM2-135M (dung lượng nhẹ, khởi động nhanh)
    const selectedModel = "SmolLM2-135M-Instruct-q4f16_1-MLC";

    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusText = document.getElementById('statusText');
    const loadBox = document.getElementById('loadBox');
    const loadLabel = document.getElementById('loadLabel');
    const progressBar = document.getElementById('progressBar');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const messageList = document.getElementById('messageList');
    const chatView = document.getElementById('chatView');

    let engine;

    async function initAI() {
      try {
        engine = await webllm.CreateMLCEngine(
          selectedModel,
          {
            initProgressCallback: (progress) => {
              const text = progress.text;
              loadLabel.textContent = text;
              if (progress.progress !== undefined) {
                const pct = Math.round(progress.progress * 100);
                progressBar.style.width = pct + '%';
              }
            }
          }
        );

        statusText.textContent = "Đã sẵn sàng (Sử dụng WebGPU)";
        loadBox.style.display = 'none';
        promptInput.disabled = false;
        sendBtn.disabled = false;
        promptInput.focus();
      } catch (err) {
        statusText.textContent = "Không hỗ trợ WebGPU";
        loadLabel.textContent = "❌ Trình duyệt hoặc phần cứng của bạn chưa hỗ trợ WebGPU. Hãy thử dùng Google Chrome / Microsoft Edge phiên bản mới nhất trên máy tính.";
      }
    }

    window.autoResize = function(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    };

    window.handleSend = async function() {
      const text = promptInput.value.trim();
      if (!text || !engine) return;

      welcomeScreen.style.display = 'none';

      // Tạo tin nhắn người dùng
      const uRow = document.createElement('div');
      uRow.className = 'msg-row user';
      uRow.innerHTML = `<div class="msg-user-bubble">${escapeHtml(text)}</div>`;
      messageList.appendChild(uRow);

      promptInput.value = '';
      autoResize(promptInput);
      promptInput.disabled = true;
      sendBtn.disabled = true;

      // Tạo khung phản hồi của AI
      const aiRow = document.createElement('div');
      aiRow.className = 'msg-ai-box';
      aiRow.innerHTML = `
        <div class="ai-avatar">💻</div>
        <div class="ai-content">Đang suy nghĩ...</div>
      `;
      messageList.appendChild(aiRow);
      chatView.scrollTop = chatView.scrollHeight;

      const contentDiv = aiRow.querySelector('.ai-content');

      try {
        const messages = [
          { role: "system", content: "You are a helpful and friendly AI assistant." },
          { role: "user", content: text }
        ];

        const chunks = await engine.chat.completions.create({
          messages,
          stream: true,
        });

        contentDiv.textContent = "";
        for await (const chunk of chunks) {
          const content = chunk.choices[0]?.delta?.content || "";
          contentDiv.textContent += content;
          chatView.scrollTop = chatView.scrollHeight;
        }
      } catch (err) {
        contentDiv.textContent = "❌ Lỗi xử lý: " + err.message;
      }

      promptInput.disabled = false;
      sendBtn.disabled = false;
      promptInput.focus();
    };

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Khởi tạo AI khi trang web vừa tải xong
    initAI();
  </script>
</body>
</html>
